<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Formulario de Contacto</title>
</head>
<body>

    <h2>Formulario de Registro</h2>

    <form method="POST" action="https://script.google.com/macros/s/AKfycbyFSRh40ZmEI-XCd7axbmlIt6yurVkQVWzeOmlc9ntTzQxKUdnTZxdRaDdN5zK3qLRo/exec">

        <label for="email">Correo Electrónico:</label><br>

        <button type="submit">Enviar</button>
        
    </form>
